services:
  home-station-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-station-server
    restart: always
    expose:
      - "8080"
    environment:
      - PORT=8080
      - SERIAL_PORT=/dev/ttyACM0
      - BAUD_RATE=115200
      - LOG_LEVEL=INFO
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-0}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC:-300}
      - TEMP_THRESHOLD_WARN=${TEMP_THRESHOLD_WARN:-40.0}
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.station-http.rule=Host(`station.giakiet.io.vn`)"
      - "traefik.http.routers.station-http.entrypoints=http"
      - "traefik.http.routers.station-https.rule=Host(`station.giakiet.io.vn`)"
      - "traefik.http.routers.station-https.entrypoints=https"
      - "traefik.http.routers.station-https.tls=true"
      - "traefik.http.routers.station-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.station-svc.loadbalancer.server.port=8080"

networks:
  coolify:
    external: true
